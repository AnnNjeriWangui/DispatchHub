    // --- 2. RIDER SERVICE & OFFLINE QUEUE MANAGER ---
    const DELIVERY_STATES = {
      ASSIGNED: 'ASSIGNED',
      PICKED_UP: 'PICKED_UP',
      IN_TRANSIT: 'IN_TRANSIT',
      DELIVERED: 'DELIVERED',
      CANCELLED: 'CANCELLED'
    };

      [DELIVERY_STATES.PICKED_UP]: DELIVERY_STATES.IN_TRANSIT,
      [DELIVERY_STATES.IN_TRANSIT]: DELIVERY_STATES.DELIVERED,
      [DELIVERY_STATES.DELIVERED]: null
    };

    class RiderServiceStandalone {
      constructor() {
        this.listeners = new Set();
        this.setupOnlineListeners();
      }

      setupOnlineListeners() {
        window.addEventListener('online', () => {
          this.notifyListeners('network', { online: true });
          this.flushOfflineQueue();
        });
        window.addEventListener('offline', () => {
          this.notifyListeners('network', { online: false });
        });
      }

      subscribe(cb) {
        this.listeners.add(cb);
        return () => this.listeners.delete(cb);
      }

      notifyListeners(type, payload) {
        this.listeners.forEach(cb => cb(type, payload));
      }

      getCurrentRider() {
        const cached = localStorage.getItem('rider_user');
        return cached ? JSON.parse(cached) : MOCK_RIDERS[0];
      }

      isLoggedIn() {
        return !!localStorage.getItem('rider_token');
      }

      async loginWithPhone(phone, otp) {
        const clean = phone.trim().replace(/\s+/g, '');
        if (!/^(\+254|0)[17]\d{8}$/.test(clean)) {
          throw new Error('Invalid Kenyan phone number format.');
        }
        if (!otp || otp.length !== 6) {
          throw new Error('Please enter 6-digit SMS OTP code.');
        }
        const rider = MOCK_RIDERS.find(r => clean.includes(r.formattedPhone.slice(-8))) || MOCK_RIDERS[0];
        const token = `jwt_${rider.id}_${Date.now()}`;
        localStorage.setItem('rider_token', token);
        localStorage.setItem('rider_user', JSON.stringify(rider));
        return { token, rider };
      }

      async loginWithGoogle() {
        const rider = MOCK_RIDERS[1];
        const token = `jwt_google_${rider.id}_${Date.now()}`;
        localStorage.setItem('rider_token', token);
        localStorage.setItem('rider_user', JSON.stringify(rider));
        return { token, rider };
      }

      logout() {
        localStorage.removeItem('rider_token');
        localStorage.removeItem('rider_user');
      }

      getOfflineQueue() {
        const queue = localStorage.getItem('reflex_offline_queue');
        return queue ? JSON.parse(queue) : [];
      }

      queueOfflineUpdate(action) {
        const queue = this.getOfflineQueue();
        queue.push(action);
        localStorage.setItem('reflex_offline_queue', JSON.stringify(queue));
        this.notifyListeners('queue_changed', { queueLength: queue.length });
      }

      async flushOfflineQueue() {
        const queue = this.getOfflineQueue();
        if (queue.length === 0) return;
        localStorage.removeItem('reflex_offline_queue');
        this.notifyListeners('sync_complete', { syncedCount: queue.length });
      }

      async updateOrderStatus(orderNumber, newStatus, verificationData) {
        const action = { orderNumber, newStatus, verificationData, timestamp: new Date().toISOString() };
        this.updateCachedOrders(orderNumber, newStatus, verificationData);

        try {
          const res = await fetch(`/api/orders/${orderNumber}/advance`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(action)
          });
          if (res.ok) {
            return { success: true, offline: false, message: `Order ${orderNumber} state updated to ${newStatus}.` };
          }
        } catch (e) {}
        
        return { success: true, offline: false, message: `Order ${orderNumber} state updated to ${newStatus}` };
      }

      updateCachedOrders(orderNumber, newStatus, verificationData) {
        const cached = localStorage.getItem('reflex_orders_cache');
        let orders = cached ? JSON.parse(cached) : this.getMockOrders();
        orders = orders.map(o => o.orderNumber === orderNumber ? { ...o, status: newStatus, verificationData } : o);
        localStorage.setItem('reflex_orders_cache', JSON.stringify(orders));
        this.notifyListeners('order_updated', { orderNumber, newStatus });
      }

        try {
          const res = await fetch('/api/orders');
          if (res.ok) {
            const apiOrders = await res.json();
            if (Array.isArray(apiOrders) && apiOrders.length > 0) {

                'RET-001': 'Savanna Blooms & Florist (Westlands)',

                'RET-002': 'The Hub Mall, Dagoretti Rd, Karen',
                'RET-003': 'Kimathi Street, Nairobi CBD',
                'RET-004': 'UN Avenue, Gigiri, Nairobi',
                'RET-005': 'Adlife Plaza, Chania Avenue, Kilimani'
              };
              const mapped = apiOrders.map(o => ({
                orderNumber: o.order_number,
                retailerId: o.retailer_id,
                retailerName: retailerMap[o.retailer_id] || 'Reflex Partner Merchant',
                pickupAddress: pickupMap[o.retailer_id] || 'Sarit Centre, Westlands, Nairobi',
                customerName: o.customer_name,
                customerPhone: o.customer_phone,
                deliveryAddress: o.delivery_address,
                itemDescription: o.item_description,
                status: o.status === 'In Transit' ? DELIVERY_STATES.IN_TRANSIT : (o.status === 'Delivered' ? DELIVERY_STATES.DELIVERED : (o.status === 'Picked Up' ? DELIVERY_STATES.PICKED_UP : DELIVERY_STATES.ASSIGNED)),
                amountKes: o.cod_amount || (o.item_value ? o.item_value + (o.delivery_fee || 300) : 2850),
                verificationPin: o.verification_code || '4829',
                qrPayload: `REFLEX-${o.order_number}-VERIFIED`,
                etaMinutes: o.eta_minutes || 20,
                notes: o.special_instructions || 'Deliver safely to recipient. Collect verification code upon delivery.'
              }));
              localStorage.setItem('reflex_orders_cache', JSON.stringify(mapped));
              return mapped;
            }
          }
        } catch (e) {}

        const cached = localStorage.getItem('reflex_orders_cache');
        if (cached) {
          try { return JSON.parse(cached); } catch (e) {}
        }
        const initial = this.getMockOrders();
        localStorage.setItem('reflex_orders_cache', JSON.stringify(initial));
        return initial;
      }

        return new Promise(resolve => {

    const riderService = new RiderServiceStandalone();

    // --- 3. RIDER AUTH COMPONENT ---
    function RiderAuthView({ onLoginSuccess }) {
      const [phone, setPhone] = useState('0712345678');
      const [otp, setOtp] = useState(['1','2','3','4','5','6']);
      const [step, setStep] = useState('phone');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleRequestOTP = (e) => {
        e.preventDefault();
        setError('');
        if (!/^(\+254|0)[17]\d{8}$/.test(phone.trim())) {
          setError('Invalid Kenyan phone number (e.g. 0712345678, +254712345678).');
          return;
        }
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          setStep('otp');
        }, 600);
      };

      const handleVerifyOTP = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await riderService.loginWithPhone(phone, otp.join(''));
          setLoading(false);
          onLoginSuccess(res.rider);
        } catch (err) {
          setLoading(false);
          setError(err.message);
        }
      };

      const handleGoogle = async () => {
        setLoading(true);
        const res = await riderService.loginWithGoogle();
        setLoading(false);
        onLoginSuccess(res.rider);
      };

                        }`}

                        <div className="relative w-10 h-10 flex-shrink-0">

                            className="w-10 h-10 rounded-xl object-cover border-2 border-emerald-500/40"

                <button
                  type="button"
                  onClick={handleGoogle}
                  className="w-full py-3 bg-slate-950 border border-slate-800 hover:bg-slate-800 text-slate-200 font-bold rounded-xl text-sm transition-all flex items-center justify-center gap-2"
                >
                  Sign in with Google
                </button>
              </form>
            ) : (
              <form onSubmit={handleVerifyOTP} className="space-y-5 text-center">
                <p className="text-xs text-slate-300">Enter 6-digit OTP code sent to <span className="text-emerald-400 font-bold">{phone}</span></p>
                <div className="flex justify-center gap-2">
                  {otp.map((d, i) => (
                    <input
                      key={i}
                      type="text"
                      maxLength={1}
                      value={d}
                      onChange={(e) => {
                        const copy = [...otp];
                        copy[i] = e.target.value;
                        setOtp(copy);
                      }}
                      className="w-11 h-14 bg-slate-950 border border-slate-800 rounded-xl text-center text-xl font-bold text-emerald-400"
                    />
                  ))}
                </div>
                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-sm transition-all shadow-lg"
                >
                  {loading ? 'Verifying...' : 'Verify & Access Dashboard'}
                </button>
                <button type="button" onClick={() => setStep('phone')} className="text-xs text-slate-400 hover:text-white">← Back to Phone</button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // --- 4. RIDER CARD & EV GREEN BADGE ---
    function RiderCardView({ rider }) {
      const v = rider.vehicle;
      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="relative">
                <img
                  src={rider.avatar}
                  alt={rider.name}
                  className="w-14 h-14 rounded-2xl object-cover border-2 border-emerald-500/50 shadow-md"
                  onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }}
                />
                <div
                  className="hidden w-14 h-14 rounded-2xl items-center justify-center font-black text-lg text-white border-2 border-emerald-500/50 shadow-md"
                  style={{ background: 'linear-gradient(135deg, #1B4332 0%, #2D6A4F 60%, #40916C 100%)' }}
                >
                  {rider.avatarFallback}
                </div>
                <span className={`absolute -bottom-1 -right-1 px-1.5 py-0.5 rounded-full text-[9px] font-bold border-2 border-slate-900 ${
                  rider.dutyStatus === 'ONLINE' ? 'bg-emerald-500 text-slate-950' : 'bg-amber-500 text-slate-950'
                }`}>
                  {rider.dutyStatus}
                </span>
              </div>
              <div>
                <h2 className="text-base font-black text-white">{rider.name} <span className="text-xs font-normal text-slate-400">({rider.gender})</span></h2>
                <p className="text-xs text-slate-400">{rider.phone}</p>
                <div className="text-[11px] text-amber-400 font-bold mt-0.5">★ {rider.rating} • {rider.completedDeliveries} Deliveries</div>
              </div>
            </div>
            <span className="px-3 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-xl text-xs font-bold">
              ⚡ {rider.dutyStatus}
            </span>
          </div>

          {/* EV Green Badge Container */}
          <div className="bg-emerald-950/60 border border-emerald-500/30 rounded-2xl p-4 space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 bg-emerald-500 text-slate-950 font-black text-[9px] rounded uppercase">EV FLEET</span>
                <span className="bg-emerald-950 text-emerald-300 border-2 border-emerald-500 font-mono text-sm px-2 py-0.5 rounded-lg font-black">{v.plateNumber}</span>
              </div>
              <span className="text-xs font-bold text-emerald-300">{v.model}</span>
            </div>

            <div className="space-y-1">
              <div className="flex justify-between text-xs text-slate-300">
                <span>Battery Level</span>
                <span className="font-bold text-emerald-400">{v.batteryLevel}% (~{v.estimatedRangeKm} km)</span>
              </div>
              <div className="w-full h-2 bg-slate-950 rounded-full overflow-hidden">
                <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${v.batteryLevel}%` }} />
              </div>
            </div>
            <div className="text-[11px] text-slate-400 flex justify-between border-t border-emerald-500/20 pt-2">
              <span>Nearest Swap Station:</span>
              <span className="text-emerald-400 font-semibold">{v.swapStationNearby}</span>
            </div>
          </div>
        </div>
      );
    }

    // --- 5. DUAL VERIFICATION MODAL ---
    function DeliveryVerificationModal({ order, onClose, onVerified }) {
      const [tab, setTab] = useState('pin');
      const [pin, setPin] = useState(['', '', '', '']);
      const [loading, setLoading] = useState(false);
      const [mpesaPopup, setMpesaPopup] = useState(null);

      const handlePin = (i, val) => {
        const copy = [...pin];
        copy[i] = val.slice(-1);
        setPin(copy);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        const res = await riderService.triggerMpesaSTKPush(order.customerPhone, order.amountKes, order.orderNumber);
        await riderService.updateOrderStatus(order.orderNumber, 'DELIVERED', { method: tab, code: pin.join('') });
        setLoading(false);
        setMpesaPopup(res);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative text-slate-100">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>

            <div className="text-center mb-4">
              <h2 className="text-lg font-black text-white">Dual Delivery Verification</h2>
              <p className="text-xs text-slate-400">Order: <span className="font-mono text-emerald-400 font-bold">{order.orderNumber}</span></p>
            </div>

            <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl mb-4">
              <button onClick={() => setTab('pin')} className={`py-2 text-xs font-bold rounded-lg ${tab === 'pin' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>4-Digit SMS PIN</button>
              <button onClick={() => setTab('qr')} className={`py-2 text-xs font-bold rounded-lg ${tab === 'qr' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>QR Code Scanner</button>
            </div>

            {tab === 'pin' ? (
              <form onSubmit={handleSubmit} className="space-y-4 text-center">
                <p className="text-xs text-slate-300">Enter SMS code from {order.customerName}</p>
                <div className="flex justify-center gap-2">
                  {pin.map((p, i) => (
                    <input
                      key={i}
                      type="text"
                      maxLength={1}
                      value={p}
                      onChange={(e) => handlePin(i, e.target.value)}
                      className="w-12 h-14 bg-slate-950 border border-slate-800 rounded-xl text-center text-xl font-bold text-emerald-400"
                    />
                  ))}
                </div>
                <div className="text-xs text-slate-400 bg-slate-950 p-2 rounded-xl">Demo PIN: <span className="text-emerald-400 font-mono font-bold">{order.verificationPin}</span></div>
                <button type="submit" disabled={loading} className="w-full py-3 bg-emerald-500 text-slate-950 font-black rounded-xl text-sm">
                  {loading ? 'Processing...' : 'Confirm Delivery & Trigger M-Pesa'}
                </button>
              </form>
            ) : (
              <div className="space-y-4 text-center">
                <div className="bg-slate-950 border-2 border-dashed border-emerald-500/40 rounded-2xl p-6">
                  <div className="w-24 h-24 border-2 border-emerald-400 rounded-xl mx-auto flex items-center justify-center text-emerald-400 text-3xl animate-pulse">
                    📷
                  </div>
                  <p className="text-xs text-slate-300 mt-2">Scan Package QR Code</p>
                </div>
                <button onClick={handleSubmit} disabled={loading} className="w-full py-3 bg-emerald-500 text-slate-950 font-black rounded-xl text-sm">
                  {loading ? 'Scanning...' : 'Scan & Complete Delivery'}
                </button>
              </div>
            )}

            {mpesaPopup && (
              <div className="absolute inset-0 bg-slate-950/95 p-6 flex flex-col items-center justify-center text-center space-y-4 z-20">
                <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-2xl font-bold">✓</div>
                <h3 className="text-xl font-black text-white">M-Pesa STK Push Sent!</h3>
                <p className="text-xs text-slate-300">Prompt sent to {order.customerPhone} for KES {order.amountKes}.</p>
                <button onClick={() => { onVerified(); onClose(); }} className="w-full py-3 bg-emerald-500 text-slate-950 font-black rounded-xl text-sm">
                  Done
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 6. GPS TRACKER VIEW ---
    function RiderTrackerView() {
      const [pos, setPos] = useState({ lat: -1.2618, lng: 36.8049, speed: 32, heading: 140, loc: "Sarit Centre, Westlands" });
      const [sim, setSim] = useState(true);

      useEffect(() => {
        const timer = setInterval(() => {
          setPos(prev => ({
            ...prev,
            lat: prev.lat + (Math.random() - 0.5) * 0.0008,
            lng: prev.lng + (Math.random() - 0.5) * 0.0008,
            speed: 25 + Math.floor(Math.random() * 15),
            heading: (prev.heading + 5) % 360
          }));
        }, 3000);
        return () => clearInterval(timer);
      }, []);

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 text-slate-100 shadow-xl">
          <div className="flex items-center justify-between">
            <h3 className="text-xs font-black uppercase text-white flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping" />
              Live GPS Telemetry Emitter
            </h3>
            <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/40">
              Nairobi Route Active
            </span>
          </div>

          <div className="relative bg-slate-950 rounded-2xl h-44 border border-slate-800 p-4 flex flex-col justify-between overflow-hidden">
            <div className="flex justify-between text-xs text-emerald-400 font-bold">
              <span>📍 {pos.loc}</span>
              <span className="text-slate-400">1.8 km to dropoff</span>
            </div>

            <div className="flex justify-between items-end text-xs font-mono">
              <div className="bg-slate-900/80 p-2 rounded-xl border border-slate-800 text-[11px]">
                <div>LAT: {pos.lat.toFixed(5)}</div>
                <div>LNG: {pos.lng.toFixed(5)}</div>
              </div>
              <div className="bg-slate-900/80 p-2 rounded-xl border border-slate-800 text-emerald-400 font-bold text-center">
                Heading {pos.heading}°
              </div>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 text-center text-xs">
            <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
              <div className="text-[10px] text-slate-400">Speed</div>
              <div className="font-bold text-white font-mono">{pos.speed} km/h</div>
            </div>
            <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
              <div className="text-[10px] text-slate-400">Accuracy</div>
              <div className="font-bold text-emerald-400 font-mono">±3.5 m</div>
            </div>
            <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
              <div className="text-[10px] text-slate-400">Est. Arrival</div>
              <div className="font-bold text-white font-mono">8 mins</div>
            </div>
          </div>
        </div>
      );
    }

    // --- 7. MAIN RIDER DASHBOARD & APP ROOT ---
    function RiderAppRoot() {
      const [rider, setRider] = useState(riderService.getCurrentRider());
      const [isLoggedIn, setIsLoggedIn] = useState(riderService.isLoggedIn());
      const [orders, setOrders] = useState([]);
      const [tab, setTab] = useState('ALL');
      const [view, setView] = useState('orders'); // 'orders' | 'tracker' | 'profile'
      const [verifyOrder, setVerifyOrder] = useState(null);
      const [queueCount, setQueueCount] = useState(riderService.getOfflineQueue().length);
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      useEffect(() => {
        load();
        const unsub = riderService.subscribe((t, p) => {
          if (t === 'network') setIsOnline(p.online);
          if (t === 'queue_changed') setQueueCount(p.queueLength);
          if (t === 'order_updated') load();
        });
        return () => unsub();
      }, [rider]);

      const load = async () => {
        const data = await riderService.getAssignedOrders();
        setOrders(data);
      };

      const handleAdvance = async (o) => {
        const next = NEXT_STATE_MAP[o.status];
        if (next === DELIVERY_STATES.DELIVERED) {
          setVerifyOrder(o);
        } else if (next) {
          await riderService.updateOrderStatus(o.orderNumber, next);
          load();
        }
      };

      if (!isLoggedIn) {
        return <RiderAuthView onLoginSuccess={(r) => { setRider(r); setIsLoggedIn(true); }} />;
      }

      const filtered = orders.filter(o => tab === 'ALL' || o.status === tab);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
          
          {/* Header */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 font-black flex items-center justify-center">⚡</span>
                <div>
                  <div className="font-bold text-sm text-white">Reflex Rider <span className="text-[9px] bg-emerald-500 text-slate-950 font-black px-1 py-0.2 rounded">EV</span></div>
                  <div className="text-[10px] text-slate-400 font-mono">{rider.vehicle.plateNumber}</div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold border ${isOnline ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border-amber-500/40'}`}>
                  {isOnline ? 'ONLINE' : `OFFLINE (${queueCount})`}
                </span>
                <select
                  value={rider.id}
                  onChange={(e) => {
                    const match = MOCK_RIDERS.find(r => r.id === e.target.value);
                    if (match) { setRider(match); localStorage.setItem('rider_user', JSON.stringify(match)); }
                  }}
                  className="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-1.5 py-1"
                >
                  {MOCK_RIDERS.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="max-w-xl mx-auto p-4 space-y-4">
            
            {view === 'orders' && (
              <>
                <RiderCardView rider={rider} />

                {/* Tabs */}
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar bg-slate-900 p-1.5 border border-slate-800 rounded-2xl">
                  {['ALL', 'ASSIGNED', 'PICKED_UP', 'IN_TRANSIT', 'DELIVERED'].map(t => (
                    <button
                      key={t}
                      onClick={() => setTab(t)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${tab === t ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
                    >
                      {t}
                    </button>
                  ))}
                </div>

                {/* Order List */}
                <div className="space-y-3">
                  {filtered.map(o => (
                    <div key={o.orderNumber} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                      <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                        <span className="font-mono font-bold text-white text-sm">{o.orderNumber}</span>
                        <span className="text-[11px] font-bold px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded-full border border-emerald-500/40">{o.status}</span>
                      </div>

                      <div className="text-xs space-y-1">
                        <div className="text-slate-400"><span className="text-white font-bold">Pickup:</span> {o.retailerName} ({o.pickupAddress})</div>
                        <div className="text-slate-400"><span className="text-white font-bold">Delivery:</span> {o.customerName} - {o.deliveryAddress}</div>
                        <div className="text-emerald-300 font-semibold">📦 {o.itemDescription} • KES {o.amountKes}</div>
                      </div>

                      {o.status !== 'DELIVERED' && (
                        <button
                          onClick={() => handleAdvance(o)}
                          className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs transition-all"
                        >
                          {o.status === 'ASSIGNED' ? 'Confirm Package Pickup' : (o.status === 'PICKED_UP' ? 'Start Transit to Customer' : 'Verify & Deliver')}
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </>
            )}

            {view === 'tracker' && <RiderTrackerView />}
            {view === 'profile' && <RiderCardView rider={rider} />}

          </main>

          {/* Verification Modal */}
          {verifyOrder && (
            <DeliveryVerificationModal
              order={verifyOrder}
              onClose={() => setVerifyOrder(null)}
              onVerified={() => { setVerifyOrder(null); load(); }}
            />
          )}

          {/* Bottom Nav */}
          <nav className="fixed bottom-0 inset-x-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 px-4 py-2">
            <div className="max-w-md mx-auto grid grid-cols-3 gap-1 text-center">
              <button onClick={() => setView('orders')} className={`py-2 text-xs font-bold rounded-xl ${view === 'orders' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'}`}>
                📦 Orders Feed
              </button>
              <button onClick={() => setView('tracker')} className={`py-2 text-xs font-bold rounded-xl ${view === 'tracker' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'}`}>
                📡 GPS Radar
              </button>
              <button onClick={() => setView('profile')} className={`py-2 text-xs font-bold rounded-xl ${view === 'profile' ? 'bg-emerald-500/20 text-emerald-400' : 'text-slate-400'}`}>
                ⚡ EV Profile
              </button>
            </div>
          </nav>
        </div>
      );
    }

    // Render to DOM
    ReactDOM.createRoot(document.getElementById('rider-root')).render(<RiderAppRoot />);
  </script>
  {% endraw %}
</body>
</html>
