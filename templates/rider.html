    // --- 2. RIDER SERVICE & MASTER ORDER PERSISTENCE ---
    const DELIVERY_STATES = {
      ASSIGNED: 'ASSIGNED',
      PICKED_UP: 'PICKED_UP',
      IN_TRANSIT: 'IN_TRANSIT',
      DELIVERED: 'DELIVERED',
      CANCELLED: 'CANCELLED'
    };

    const NEXT_STATE_MAP = {
      [DELIVERY_STATES.ASSIGNED]: DELIVERY_STATES.PICKED_UP,
      [DELIVERY_STATES.PICKED_UP]: DELIVERY_STATES.IN_TRANSIT,
      [DELIVERY_STATES.IN_TRANSIT]: DELIVERY_STATES.DELIVERED,
      [DELIVERY_STATES.DELIVERED]: null
    };

    const STORAGE_KEY = 'dispatchhub_master_orders';

    function getLocalOrders() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLocalOrders(orders) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
        window.dispatchEvent(new CustomEvent('dispatchhub_order_update', { detail: orders }));
      } catch (e) {}
    }

    function reconcileOrders(localOrders, serverOrders) {
      const map = new Map();
      if (Array.isArray(serverOrders)) {
        for (const o of serverOrders) {
          if (o && o.order_number) map.set(o.order_number, { ...o });
        }
      }
      if (Array.isArray(localOrders)) {
        for (const local of localOrders) {
          if (!local || !local.order_number) continue;
          const existing = map.get(local.order_number);
          if (!existing) {
            map.set(local.order_number, { ...local });
          } else {
            const rank = { 'Pending': 1, 'Assigned': 2, 'Picked Up': 3, 'In Transit': 4, 'Delivered': 5, 'Cancelled': 6 };
            if ((rank[local.status] || 0) > (rank[existing.status] || 0)) {
              existing.status = local.status;
            }
            if (local.dispatcher_id && !existing.dispatcher_id) {
              existing.dispatcher_id = local.dispatcher_id;
              existing.dispatcher_name = local.dispatcher_name;
              existing.driver_phone = local.driver_phone;
              existing.vehicle_type = local.vehicle_type;
              existing.vehicle_reg = local.vehicle_reg;
            }
          }
        }
      }
      const merged = Array.from(map.values());
      merged.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      return merged;
    }

    class RiderServiceStandalone {
      constructor() {
        this.listeners = new Set();
      }

      subscribe(cb) {
        this.listeners.add(cb);
        return () => this.listeners.delete(cb);
      }

      notifyListeners(type, payload) {
        this.listeners.forEach(cb => cb(type, payload));
      }

      getCurrentRider() {
        const cached = localStorage.getItem('rider_user');
        return cached ? JSON.parse(cached) : MOCK_RIDERS[0];
      }

      isLoggedIn() {
        return !!localStorage.getItem('rider_token');
      }

      async loginWithPhone(phone, otp) {
        const clean = phone.trim().replace(/\s+/g, '');
        if (!/^(\+254|0)[17]\d{8}$/.test(clean)) {
          throw new Error('Invalid Kenyan phone number format.');
        }
        if (!otp || otp.length !== 6) {
          throw new Error('Please enter 6-digit SMS OTP code.');
        }
        const rider = MOCK_RIDERS.find(r => clean.includes(r.formattedPhone.slice(-8))) || MOCK_RIDERS[0];
        const token = `jwt_${rider.id}_${Date.now()}`;
        localStorage.setItem('rider_token', token);
        localStorage.setItem('rider_user', JSON.stringify(rider));
        return { token, rider };
      }

      async loginWithGoogle() {
        const rider = MOCK_RIDERS[1];
        const token = `jwt_google_${rider.id}_${Date.now()}`;
        localStorage.setItem('rider_token', token);
        localStorage.setItem('rider_user', JSON.stringify(rider));
        return { token, rider };
      }

      logout() {
        localStorage.removeItem('rider_token');
        localStorage.removeItem('rider_user');
      }

      async updateOrderStatus(orderNumber, newStatus, verificationData) {
        // 1. Immediately update master persistent storage
        const local = getLocalOrders();
        const target = local.find(o => o.order_number === orderNumber);
        if (target) {
          const apiStatus = newStatus === DELIVERY_STATES.IN_TRANSIT ? 'In Transit' :
                           (newStatus === DELIVERY_STATES.DELIVERED ? 'Delivered' :
                           (newStatus === DELIVERY_STATES.PICKED_UP ? 'Picked Up' : 'Assigned'));
          target.status = apiStatus;
          if (newStatus === DELIVERY_STATES.DELIVERED) {
            target.delivered_at = new Date().toISOString();
          }
          saveLocalOrders(local);
        }

        this.notifyListeners('order_updated', { orderNumber, newStatus });

        // 2. Sync with backend API in parallel
        try {
          if (newStatus === DELIVERY_STATES.DELIVERED) {
            await fetch(`/api/orders/${orderNumber}/status`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: 'Delivered', verification_code: verificationData ? verificationData.code : undefined })
            });
          } else {
            await fetch(`/api/orders/${orderNumber}/advance`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ newStatus })
            });
          }
        } catch (e) {}
        
        return { success: true, message: `Order ${orderNumber} state updated to ${newStatus}.` };
      }

      async getAssignedOrders(currentRider) {
        const local = getLocalOrders();
        let apiOrders = [];
        try {
          const res = await fetch('/api/orders');
          if (res.ok) {
            apiOrders = await res.json();
          }
        } catch (e) {}

        const reconciled = reconcileOrders(local, apiOrders);
        saveLocalOrders(reconciled);

        const retailerMap = {
          'RET-001': 'Savanna Blooms & Florist (Westlands)',
          'RET-002': 'Rift Valley Artisan Goods (Karen)',
          'RET-003': 'Nairobi Tech & Gadget Hub (CBD)',
          'RET-004': 'Organic Fresh Basket (Gigiri)',
          'RET-005': 'Urban Books & Stationers (Kilimani)'
        };
        const pickupMap = {
          'RET-001': 'Mpaka Road Plaza, Westlands, Nairobi',
          'RET-002': 'The Hub Mall, Dagoretti Rd, Karen',
          'RET-003': 'Kimathi Street, Nairobi CBD',
          'RET-004': 'UN Avenue, Gigiri, Nairobi',
          'RET-005': 'Adlife Plaza, Chania Avenue, Kilimani'
        };

        const riderId = currentRider ? currentRider.id : 'RIDER-001';
        const riderName = currentRider ? currentRider.name.toLowerCase() : 'hesbon';

        // Filter orders relevant to this rider, or unassigned available in queue
        const riderOrders = reconciled.filter(o => 
          o.dispatcher_id === riderId || 
          (o.dispatcher_name && o.dispatcher_name.toLowerCase().includes(riderName.split(' ')[0])) ||
          (!o.dispatcher_id && o.status === 'Pending') ||
          reconciled.length <= 4 // show orders for rich interactive demo experience
        );

        const targetList = riderOrders.length > 0 ? riderOrders : reconciled;

        return targetList.map(o => ({
          orderNumber: o.order_number,
          retailerId: o.retailer_id,
          retailerName: retailerMap[o.retailer_id] || 'Reflex Partner Merchant',
          pickupAddress: pickupMap[o.retailer_id] || 'Sarit Centre, Westlands, Nairobi',
          customerName: o.customer_name,
          customerPhone: o.customer_phone,
          deliveryAddress: o.delivery_address,
          itemDescription: o.item_description,
          status: o.status === 'In Transit' ? DELIVERY_STATES.IN_TRANSIT : 
                 (o.status === 'Delivered' ? DELIVERY_STATES.DELIVERED : 
                 (o.status === 'Picked Up' ? DELIVERY_STATES.PICKED_UP : DELIVERY_STATES.ASSIGNED)),
          amountKes: o.cod_amount || (o.item_value ? o.item_value + (o.delivery_fee || 300) : 2850),
          verificationPin: o.verification_code || '4829',
          qrPayload: `REFLEX-${o.order_number}-VERIFIED`,
          etaMinutes: o.eta_minutes || 20,
          notes: o.special_instructions || 'Deliver safely to recipient. Collect verification code upon delivery.'
        }));
      }

      async triggerMpesaSTKPush(phone, amount, orderNo) {
        return new Promise(resolve => {
          setTimeout(() => {
            resolve({
              CheckoutRequestID: `ws_CO_${Date.now()}`,
              CustomerMessage: `STK Push sent to ${phone} for KES ${amount}.`
            });
          }, 800);
        });
      }
    }

    const riderService = new RiderServiceStandalone();

    // --- 3. RIDER AUTH COMPONENT ---
    function RiderAuthView({ onLoginSuccess }) {
      const [phone, setPhone] = useState('0712345678');
      const [otp, setOtp] = useState(['1','2','3','4','5','6']);
      const [step, setStep] = useState('phone');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleRequestOTP = (e) => {
        e.preventDefault();
        setError('');
        if (!/^(\+254|0)[17]\d{8}$/.test(phone.trim())) {
          setError('Invalid Kenyan phone number (e.g. 0712345678, +254712345678).');
          return;
        }
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          setStep('otp');
        }, 500);
      };

      const handleVerifyOTP = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await riderService.loginWithPhone(phone, otp.join(''));
          setLoading(false);
          onLoginSuccess(res.rider);
        } catch (err) {
          setLoading(false);
          setError(err.message);
        }
      };

      const handleGoogle = async () => {
        setLoading(true);
        const res = await riderService.loginWithGoogle();
        setLoading(false);
        onLoginSuccess(res.rider);
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4" style="background-color: #f8fafc;">
          <div className="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl text-slate-800 space-y-6">
            <div className="text-center">
              <div className="w-14 h-14 bg-indigo-50 border border-indigo-200 rounded-2xl mx-auto flex items-center justify-center text-indigo-600 text-2xl font-black mb-3">
                ⚡
              </div>
              <h1 className="text-2xl font-black text-slate-900">Reflex Rider Portal</h1>
              <p className="text-xs text-slate-500 mt-1">Kenyan EV Fleet Logistics & Delivery OS</p>
            </div>

            {error && (
              <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs">
                {error}
              </div>
            )}

            {step === 'phone' ? (
              <form onSubmit={handleRequestOTP} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">Kenyan Mobile Number</label>
                  <input
                    type="tel"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    placeholder="0712345678"
                    className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-600"
                    required
                  />
                </div>

                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                  <span className="text-[11px] font-bold text-slate-600 block">Select Demo Rider Profile:</span>
                  <div className="grid grid-cols-3 gap-2">
                    {MOCK_RIDERS.map(r => (
                      <button
                        key={r.id}
                        type="button"
                        onClick={() => setPhone(r.formattedPhone)}
                        className={`flex flex-col items-center gap-1.5 p-2 rounded-xl text-center text-xs border transition-all ${
                          phone === r.formattedPhone
                            ? 'bg-indigo-50 border-indigo-600 text-indigo-700 font-bold shadow-sm'
                            : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'
                        }`}
                      >
                        <div className="relative w-10 h-10 flex-shrink-0">
                          <img
                            src={r.avatar}
                            alt={r.name}
                            className="w-10 h-10 rounded-xl object-cover border border-slate-200"
                            onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }}
                          />
                          <div
                            className="hidden w-10 h-10 rounded-xl items-center justify-center font-black text-[11px] text-white bg-indigo-600 border border-indigo-500"
                          >
                            {r.avatarFallback}
                          </div>
                          <span className={`absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border border-white ${
                            r.dutyStatus === 'ONLINE' ? 'bg-emerald-500' : 'bg-amber-500'
                          }`} />
                        </div>
                        <div className="font-bold text-[10px] leading-tight line-clamp-2">{r.name}</div>
                        <div className="text-[9px] opacity-60 font-mono">{r.vehicle.plateNumber}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md"
                >
                  {loading ? 'Sending OTP...' : 'Send SMS OTP Verification'}
                </button>

                <button
                  type="button"
                  onClick={handleGoogle}
                  className="w-full py-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl text-sm transition-all flex items-center justify-center gap-2"
                >
                  Sign in with Google
                </button>
              </form>
            ) : (
              <form onSubmit={handleVerifyOTP} className="space-y-5 text-center">
                <p className="text-xs text-slate-600">Enter 6-digit OTP code sent to <span className="text-indigo-600 font-bold">{phone}</span></p>
                <div className="flex justify-center gap-2">
                  {otp.map((d, i) => (
                    <input
                      key={i}
                      type="text"
                      maxLength={1}
                      value={d}
                      onChange={(e) => {
                        const copy = [...otp];
                        copy[i] = e.target.value;
                        setOtp(copy);
                      }}
                      className="w-11 h-14 bg-slate-50 border border-slate-300 rounded-xl text-center text-xl font-bold text-indigo-600 focus:border-indigo-600 outline-none"
                    />
                  ))}
                </div>
                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md"
                >
                  {loading ? 'Verifying...' : 'Verify & Access Dashboard'}
                </button>
                <button type="button" onClick={() => setStep('phone')} className="text-xs text-slate-500 hover:text-slate-800">← Back to Phone</button>
              </form>
            )}
          </div>
        </div>
      );
    }

                  alt={rider.name}
                  className="w-14 h-14 rounded-2xl object-cover border border-slate-200 shadow-sm"
                  onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }}
                />
                <div
                  className="hidden w-14 h-14 rounded-2xl items-center justify-center font-black text-lg text-white bg-indigo-600 shadow-sm"
                >
                  {rider.avatarFallback}
                </div>
                <span className={`absolute -bottom-1 -right-1 px-1.5 py-0.5 rounded-full text-[9px] font-bold border-2 border-white ${
                  rider.dutyStatus === 'ONLINE' ? 'bg-emerald-500 text-white' : 'bg-amber-500 text-white'
                }`}>
                  {rider.dutyStatus}
                </span>
              </div>
              <div>
                <h2 className="text-base font-black text-slate-900">{rider.name} <span className="text-xs font-normal text-slate-500">({rider.gender})</span></h2>
                <p className="text-xs text-slate-500">{rider.phone}</p>
                <div className="text-[11px] text-amber-600 font-bold mt-0.5">★ {rider.rating} • {rider.completedDeliveries} Deliveries</div>
              </div>
            </div>
            <span className="px-3 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-xl text-xs font-bold">
              ⚡ {rider.dutyStatus}
            </span>
          </div>

          {/* EV Fleet Container */}
          <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 bg-indigo-600 text-white font-black text-[9px] rounded uppercase">EV FLEET</span>
                <span className="bg-white text-indigo-700 border border-indigo-200 font-mono text-sm px-2 py-0.5 rounded-lg font-black">{v.plateNumber}</span>
              </div>
              <span className="text-xs font-bold text-slate-700">{v.model}</span>
            </div>

            <div className="space-y-1">
              <div className="flex justify-between text-xs text-slate-600">
                <span>Battery Level</span>
                <span className="font-bold text-emerald-600">{v.batteryLevel}% (~{v.estimatedRangeKm} km)</span>
              </div>
              <div className="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${v.batteryLevel}%` }} />
              </div>
            </div>
            <div className="text-[11px] text-slate-500 flex justify-between border-t border-slate-200 pt-2">
              <span>Nearest Swap Station:</span>
              <span className="text-indigo-600 font-semibold">{v.swapStationNearby}</span>
            </div>
          </div>
        </div>
      );
    }

    // --- 5. DUAL VERIFICATION MODAL ---
    function DeliveryVerificationModal({ order, onClose, onVerified }) {
      const [tab, setTab] = useState('pin');
      const [pin, setPin] = useState(['', '', '', '']);
      const [loading, setLoading] = useState(false);
      const [mpesaPopup, setMpesaPopup] = useState(null);

      const handlePin = (i, val) => {
        const copy = [...pin];
        copy[i] = val.slice(-1);
        setPin(copy);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        const res = await riderService.triggerMpesaSTKPush(order.customerPhone, order.amountKes, order.orderNumber);
        await riderService.updateOrderStatus(order.orderNumber, 'DELIVERED', { method: tab, code: pin.join('') });
        setLoading(false);
        setMpesaPopup(res);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-6 shadow-2xl relative text-slate-800">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">✕</button>

            <div className="text-center mb-4">
              <h2 className="text-lg font-black text-slate-900">Dual Delivery Verification</h2>
              <p className="text-xs text-slate-500">Order: <span className="font-mono text-indigo-600 font-bold">{order.orderNumber}</span></p>
            </div>

            <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl mb-4">
              <button onClick={() => setTab('pin')} className={`py-2 text-xs font-bold rounded-lg ${tab === 'pin' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600'}`}>4-Digit SMS PIN</button>
              <button onClick={() => setTab('qr')} className={`py-2 text-xs font-bold rounded-lg ${tab === 'qr' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600'}`}>QR Code Scanner</button>
            </div>

            {tab === 'pin' ? (
              <form onSubmit={handleSubmit} className="space-y-4 text-center">
                <p className="text-xs text-slate-600">Enter SMS code from {order.customerName}</p>
                <div className="flex justify-center gap-2">
                  {pin.map((p, i) => (
                    <input
                      key={i}
                      type="text"
                      maxLength={1}
                      value={p}
                      onChange={(e) => handlePin(i, e.target.value)}
                      className="w-12 h-14 bg-slate-50 border border-slate-300 rounded-xl text-center text-xl font-bold text-indigo-600 focus:border-indigo-600 outline-none"
                    />
                  ))}
                </div>
                <div className="text-xs text-slate-500 bg-slate-50 p-2 rounded-xl border border-slate-200">Demo PIN: <span className="text-indigo-600 font-mono font-bold">{order.verificationPin}</span></div>
                <button type="submit" disabled={loading} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md">
                  {loading ? 'Processing...' : 'Confirm Delivery & Trigger M-Pesa'}
                </button>
              </form>
            ) : (
              <div className="space-y-4 text-center">
                <div className="bg-slate-50 border-2 border-dashed border-indigo-300 rounded-2xl p-6">
                  <div className="w-24 h-24 border-2 border-indigo-400 rounded-xl mx-auto flex items-center justify-center text-indigo-600 text-3xl animate-pulse">
                    📷
                  </div>
                  <p className="text-xs text-slate-600 mt-2">Scan Package QR Code</p>
                </div>
                <button onClick={handleSubmit} disabled={loading} className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition-all shadow-md">
                  {loading ? 'Scanning...' : 'Scan & Complete Delivery'}
                </button>
              </div>
            )}

            {mpesaPopup && (
              <div className="absolute inset-0 bg-white/95 p-6 rounded-3xl flex flex-col items-center justify-center text-center space-y-4 z-20">
                <div className="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl font-bold">✓</div>
                <h3 className="text-xl font-black text-slate-900">M-Pesa STK Push Sent!</h3>
                <p className="text-xs text-slate-600">Prompt sent to {order.customerPhone} for KES {order.amountKes}.</p>
                <button onClick={() => { onVerified(); onClose(); }} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl text-sm shadow-md">
                  Done
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 6. GPS TRACKER VIEW ---
    function RiderTrackerView() {
      const [pos, setPos] = useState({ lat: -1.2618, lng: 36.8049, speed: 32, heading: 140, loc: "Sarit Centre, Westlands" });

      useEffect(() => {
        const timer = setInterval(() => {
          setPos(prev => ({
            ...prev,
            lat: prev.lat + (Math.random() - 0.5) * 0.0008,
            lng: prev.lng + (Math.random() - 0.5) * 0.0008,
            speed: 25 + Math.floor(Math.random() * 15),
            heading: (prev.heading + 5) % 360
          }));
        }, 3000);
        return () => clearInterval(timer);
      }, []);

      return (
        <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-4 text-slate-800 shadow-sm">
          <div className="flex items-center justify-between">
            <h3 className="text-xs font-black uppercase text-slate-900 flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-indigo-600 animate-ping" />
              Live GPS Telemetry Emitter
            </h3>
            <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-bold border border-indigo-200">
              Nairobi Route Active
            </span>
          </div>

          <div className="relative bg-slate-50 rounded-2xl h-44 border border-slate-200 p-4 flex flex-col justify-between overflow-hidden">
            <div className="flex justify-between text-xs text-indigo-700 font-bold">
              <span>📍 {pos.loc}</span>
              <span className="text-slate-500">1.8 km to dropoff</span>
            </div>

            <div className="flex justify-between items-end text-xs font-mono">
              <div className="bg-white p-2 rounded-xl border border-slate-200 text-[11px] text-slate-700">
                <div>LAT: {pos.lat.toFixed(5)}</div>
                <div>LNG: {pos.lng.toFixed(5)}</div>
              </div>
              <div className="bg-white p-2 rounded-xl border border-slate-200 text-indigo-700 font-bold text-center">
                Heading {pos.heading}°
              </div>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 text-center text-xs">
            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
              <div className="text-[10px] text-slate-500">Speed</div>
              <div className="font-bold text-slate-900 font-mono">{pos.speed} km/h</div>
            </div>
            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
              <div className="text-[10px] text-slate-500">Accuracy</div>
              <div className="font-bold text-indigo-700 font-mono">±3.5 m</div>
            </div>
            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
              <div className="text-[10px] text-slate-500">Est. Arrival</div>
              <div className="font-bold text-slate-900 font-mono">8 mins</div>
            </div>
          </div>
        </div>
      );
    }

    // --- 7. MAIN RIDER DASHBOARD & APP ROOT ---
    function RiderAppRoot() {
      const [rider, setRider] = useState(riderService.getCurrentRider());
      const [isLoggedIn, setIsLoggedIn] = useState(riderService.isLoggedIn());
      const [orders, setOrders] = useState([]);
      const [tab, setTab] = useState('ALL');
      const [view, setView] = useState('orders');
      const [verifyOrder, setVerifyOrder] = useState(null);

      const load = async () => {
        const data = await riderService.getAssignedOrders(rider);
        setOrders(data);
      };

      useEffect(() => {
        load();

        // Cross-tab real-time sync
        const handleStorage = (e) => {
          if (e.key === 'dispatchhub_master_orders') load();
        };
        const handleOrderUpdate = () => load();

        window.addEventListener('storage', handleStorage);
        window.addEventListener('dispatchhub_order_update', handleOrderUpdate);

        const unsub = riderService.subscribe((t) => {
          if (t === 'order_updated') load();
        });

        // 3-second live sync loop
        const timer = setInterval(load, 3000);

        return () => {
          window.removeEventListener('storage', handleStorage);
          window.removeEventListener('dispatchhub_order_update', handleOrderUpdate);
          unsub();
          clearInterval(timer);
        };
      }, [rider]);

      const handleAdvance = async (o) => {
        const next = NEXT_STATE_MAP[o.status];
        if (next === DELIVERY_STATES.DELIVERED) {
          setVerifyOrder(o);
        } else if (next) {
          await riderService.updateOrderStatus(o.orderNumber, next);
          load();
        }
      };

      if (!isLoggedIn) {
        return <RiderAuthView onLoginSuccess={(r) => { setRider(r); setIsLoggedIn(true); }} />;
      }

      const filtered = orders.filter(o => tab === 'ALL' || o.status === tab);

      return (
        <div className="min-h-screen pb-20" style="background-color: #f8fafc;">
          
          <!-- Top Navigation Header (Deep Midnight Slate) -->
          <header class="sticky top-0 z-40 bg-[#0f172a] border-b border-slate-800 px-4 py-3 shadow-md">
            <div className="max-w-xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-8 h-8 rounded-xl bg-indigo-600/30 text-indigo-400 font-black flex items-center justify-center">⚡</span>
                <div>
                  <div className="font-bold text-sm text-white">Reflex Rider <span className="text-[9px] bg-indigo-600 text-white font-black px-1.5 py-0.5 rounded">EV</span></div>
                  <div className="text-[10px] text-slate-400 font-mono">{rider.vehicle.plateNumber}</div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  ONLINE
                </span>
                <select
                  value={rider.id}
                  onChange={(e) => {
                    const match = MOCK_RIDERS.find(r => r.id === e.target.value);
                    if (match) { 
                      setRider(match); 
                      localStorage.setItem('rider_user', JSON.stringify(match)); 
                    }
                  }}
                  className="bg-slate-800 text-xs text-white border border-slate-700 rounded-lg px-2 py-1 outline-none"
                >
                  {MOCK_RIDERS.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              </div>
            </div>
          </header>

          <!-- Main Body -->
          <main className="max-w-xl mx-auto p-4 space-y-4">
            
            {view === 'orders' && (
              <>
                <RiderCardView rider={rider} />

                {/* Filter Tabs */}
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar bg-white p-1.5 border border-slate-200 rounded-2xl shadow-sm">
                  {['ALL', 'ASSIGNED', 'PICKED_UP', 'IN_TRANSIT', 'DELIVERED'].map(t => (
                    <button
                      key={t}
                      onClick={() => setTab(t)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                        tab === t 
                          ? 'bg-indigo-600 text-white shadow-sm' 
                          : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                      }`}
                    >
                      {t}
                    </button>
                  ))}
                </div>

                {/* Order List */}
                <div className="space-y-3">
                  {filtered.length === 0 ? (
                    <div className="bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-500 shadow-sm">
                      <div className="text-2xl mb-2">📦</div>
                      <h4 className="text-sm font-bold text-slate-800">No active deliveries in this tab</h4>
                      <p className="text-xs text-slate-400 mt-1">Orders dispatched to you appear here in real-time.</p>
                    </div>
                  ) : (
                    filtered.map(o => {
                      // Soft status badge styling
                      let badgeClass = 'bg-amber-100 text-amber-800 border-amber-300';
                      if (o.status === 'IN_TRANSIT' || o.status === 'PICKED_UP') {
                        badgeClass = 'bg-blue-100 text-blue-800 border-blue-300';
                      } else if (o.status === 'DELIVERED') {
                        badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
                      }

                      return (
                        <div key={o.orderNumber} className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3 shadow-sm">
                          <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                            <span className="font-mono font-bold text-slate-900 text-sm">{o.orderNumber}</span>
                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${badgeClass}`}>{o.status}</span>
                          </div>

                          <div className="text-xs space-y-1">
                            <div className="text-slate-600"><span className="text-slate-900 font-bold">Pickup:</span> {o.retailerName} ({o.pickupAddress})</div>
                            <div className="text-slate-600"><span className="text-slate-900 font-bold">Delivery:</span> {o.customerName} - {o.deliveryAddress}</div>
                            <div className="text-indigo-700 font-semibold">📦 {o.itemDescription} • KES {o.amountKes}</div>
                          </div>

                          {o.status !== 'DELIVERED' && (
                            <button
                              onClick={() => handleAdvance(o)}
                              className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-all shadow-sm"
                            >
                              {o.status === 'ASSIGNED' ? 'Confirm Package Pickup' : (o.status === 'PICKED_UP' ? 'Start Transit to Customer' : 'Verify & Deliver')}
                            </button>
                          )}
                        </div>
                      );
                    })
                  )}
                </div>
              </>
            )}

            {view === 'tracker' && <RiderTrackerView />}
            {view === 'profile' && <RiderCardView rider={rider} />}

          </main>

          {/* Verification Modal */}
          {verifyOrder && (
            <DeliveryVerificationModal
              order={verifyOrder}
              onClose={() => setVerifyOrder(null)}
              onVerified={() => { setVerifyOrder(null); load(); }}
            />
          )}

          {/* Bottom Nav (Clean Midnight Slate Pill) */}
          <nav className="fixed bottom-0 inset-x-0 bg-[#0f172a] border-t border-slate-800 px-4 py-2 z-40">
            <div className="max-w-md mx-auto grid grid-cols-3 gap-1 text-center">
              <button onClick={() => setView('orders')} className={`py-2 text-xs font-bold rounded-xl transition ${view === 'orders' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                📦 Orders Feed
              </button>
              <button onClick={() => setView('tracker')} className={`py-2 text-xs font-bold rounded-xl transition ${view === 'tracker' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                📡 GPS Radar
              </button>
              <button onClick={() => setView('profile')} className={`py-2 text-xs font-bold rounded-xl transition ${view === 'profile' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                ⚡ EV Profile
              </button>
            </div>
          </nav>
        </div>
      );
    }

    // Render to DOM
    ReactDOM.createRoot(document.getElementById('rider-root')).render(<RiderAppRoot />);
  </script>
  {% endraw %}
</body>
</html>
